<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <title>AnyReader Kindle 简洁版</title>
    <style>
      body {
        margin: 0;
        padding: 6px 24px;
        color: #111;
        background: #fff;
        font-family: SimHei, '黑体', Arial, sans-serif;
        font-size: 26px;
        line-height: 1.6;
      }

      h1,
      h2 {
        line-height: 1.3;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2em;
      }

      h2 {
        margin: 12px 0 6px;
        font-size: 1em;
      }

      a {
        color: #111;
        text-decoration: underline;
      }

      .toolbar {
        padding: 10px 0;
        border-bottom: 1px solid #999;
      }

      #favoritesSection {
        overflow: hidden;
      }

      #favoritesSection h2 {
        float: left;
        margin: 0;
      }

      #favoritesSection button {
        float: right;
        margin-right: 0;
      }

      .toolbar a,
      .toolbar button,
      .access-box button {
        display: inline-block;
        margin: 2px 4px 2px 0;
        padding: 9px 12px;
        color: #111;
        background: #fff;
        border: 1px solid #555;
        border-radius: 2px;
        font: inherit;
        text-decoration: none;
      }

      .book a,
      .chapter a {
        display: block;
        padding: 6px 0;
      }

      .muted {
        color: #444;
        font-size: 0.8em;
      }

      .notice {
        padding: 7px 0;
        color: #333;
      }

      .error {
        color: #900;
      }

      .hidden {
        display: none;
      }

      .book {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 148px;
        padding: 11px 5px;
        border-bottom: 1px solid #999;
      }

      .book-cover {
        float: left;
        display: block;
        box-sizing: border-box;
        width: 92px;
        height: 126px;
        margin: 0 12px 5px 0;
        border: 1px solid #888;
        background: #eee;
        object-fit: cover;
      }

      .book-cover-placeholder {
        float: left;
        display: block;
        box-sizing: border-box;
        width: 92px;
        height: 126px;
        margin: 0 12px 5px 0;
        padding: 38px 4px;
        border: 1px solid #888;
        background: #eee;
        text-align: center;
        font-size: 19px;
      }

      .book-details {
        overflow: hidden;
      }

      .book-title {
        font-weight: bold;
      }

      .book button {
        margin-top: 4px;
        padding: 7px 10px;
        font: inherit;
        font-size: 19px;
      }

      #readerView {
        display: none;
      }

      #readerView:not(.hidden) {
        display: block;
      }

      body.reading {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        height: 100%;
        overflow: hidden;
        padding: 0;
      }

      html.reading {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      html.reading::-webkit-scrollbar,
      body.reading::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body.reading > #notice {
        display: none;
      }

      #readerView:not(.hidden) {
        position: fixed;
        z-index: 20;
        top: 0;
        right: 0;
        left: 0;
        height: 1130px;
        overflow: hidden;
        background: #fff;
      }

      #readerText {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 36px 32px 96px;
        overflow-x: auto;
        overflow-y: hidden;
        font-size: 48px;
        line-height: 1.6;
        overflow-wrap: break-word;
        white-space: pre-wrap;
        -webkit-column-width: 100vw;
        -webkit-column-gap: 64px;
        -webkit-column-fill: auto;
        column-width: 100vw;
        column-gap: 64px;
        column-fill: auto;
        -webkit-overflow-scrolling: touch;
      }

      #readerText::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .reader-paragraph {
        margin: 0 0 0.85em;
        text-indent: 2em;
        orphans: 1;
        widows: 1;
        -webkit-column-break-inside: auto;
        break-inside: auto;
      }

      #chapterTitle {
        position: absolute;
        z-index: 2;
        top: 2px;
        left: 32px;
        right: 32px;
        overflow: hidden;
        margin: 0;
        font-size: 24px;
        font-weight: normal;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.55;
        pointer-events: none;
      }

      .floating-toolbar {
        display: none;
        position: fixed;
        z-index: 30;
        right: 6px;
        top: 1130px;
        left: 6px;
        padding: 2px;
        border: 2px solid #000;
        border-bottom: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.82);
        text-align: center;
        opacity: 1;
      }

      .floating-toolbar:active {
        opacity: 0.95;
      }

      .floating-toolbar button {
        min-width: 56px;
        margin: 5px;
        padding: 10px 12px;
        color: #111;
        background: #fff;
        border: 2px solid #000;
        border-radius: 3px;
        font: inherit;
        font-size: 40px;
      }

      .floating-toolbar button:disabled {
        color: #888;
      }

      .reader-hint {
        display: none;
      }

      body.reading > #readerToolbar {
        display: block;
      }

      input[type='password'] {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        font: inherit;
      }

      @media (max-width: 420px) {
        body {
          padding: 4px 20px;
          font-size: 24px;
        }

        body.reading {
          padding: 0;
        }

        .book {
          width: 100%;
          min-height: 132px;
        }

        .book-cover,
        .book-cover-placeholder {
          width: 82px;
          height: 112px;
        }

        .book-cover-placeholder {
          padding-top: 34px;
        }

        .floating-toolbar {
          right: 3px;
          bottom: 4px;
          left: 3px;
        }
      }
    </style>
  </head>
  <body>
    <div id="notice" class="notice" role="status"></div>

    <section id="accessView" class="hidden">
      <h2 id="accessTitle">登录</h2>
      <p id="accessDescription">请输入 AnyReader 访问密码。</p>
      <form id="accessForm" class="access-box">
        <label for="password">访问密码</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="accessButton" type="submit">登录</button>
      </form>
    </section>

    <section id="booksView">
      <div id="favoritesSection" class="toolbar">
        <h2>书架</h2>
        <button id="refreshFavorites" type="button">刷新书架</button>
      </div>
      <div id="favoritesStatus" class="notice">正在加载书架...</div>
      <div id="favoritesList"></div>
    </section>

    <section id="chaptersView" class="hidden">
      <div class="toolbar">
        <a id="backToBooks" href="#">返回书架</a>
        <a id="reloadChapters" href="#">刷新目录</a>
        <span id="resumeRow" class="hidden">
          <button id="resumeButton" type="button">继续阅读</button>
        </span>
      </div>
      <h2 id="bookTitle"></h2>
      <div id="chaptersList"></div>
    </section>

    <section id="readerView" class="hidden">
      <h2 id="chapterTitle"></h2>
      <div id="readerText"></div>
      <div class="reader-hint">点按屏幕左右两侧翻页</div>
    </section>

    <div id="readerToolbar" class="floating-toolbar">
      <button id="previousPage" type="button" aria-label="上一页">‹</button>
      <button id="backToChapters" type="button">目录</button>
      <button id="smallerText" type="button" aria-label="缩小字号">A-</button>
      <button id="largerText" type="button" aria-label="放大字号">A+</button>
      <button id="nextPage" type="button" aria-label="下一页">›</button>
    </div>

    <script>
      (function () {
        var currentView = 'booksView';
        var selectedBook = null;
        var chapters = [];
        var chapterIndex = -1;
        var readerFontSize = 48;
        var minimumReaderFontSize = 12;
        var maximumReaderFontSize = 72;
        var readerFontSizeStorageKey = 'any-reader-kindle-font-size-v3';
        var touchStartX = 0;
        var ignoreNextReaderClick = false;
        var chapterRequestId = 0;
        var contentRequestId = 0;
        var favoritesRequestId = 0;
        var progressTimer = null;
        var accessMode = 'login';
        var viewIds = ['accessView', 'booksView', 'chaptersView', 'readerView'];
        var notice = document.getElementById('notice');
        var readerText = document.getElementById('readerText');
        var favoritesStatus = document.getElementById('favoritesStatus');

        function loadReaderFontSize() {
          var savedFontSize;
          try {
            savedFontSize = Number(window.localStorage.getItem(readerFontSizeStorageKey));
          } catch (error) {
            setNotice('无法读取已保存的字体设置：' + error.message, true);
            return readerFontSize;
          }
          if (savedFontSize >= minimumReaderFontSize && savedFontSize <= maximumReaderFontSize) return savedFontSize;
          return readerFontSize;
        }

        function saveReaderFontSize() {
          try {
            window.localStorage.setItem(readerFontSizeStorageKey, String(readerFontSize));
          } catch (error) {
            setNotice('无法保存字体设置：' + error.message, true);
          }
        }

        readerFontSize = loadReaderFontSize();

        function setNotice(text, isError) {
          notice.className = isError ? 'notice error' : 'notice';
          notice.textContent = text || '';
        }

        function getCoverUrl(value) {
          var cover = String(value || '');
          var match = cover.match(/@headers?(.+)$/);
          var headers = {};
          var imageUrl = cover;
          if (match) {
            imageUrl = cover.slice(0, match.index);
            try {
              headers = JSON.parse(decodeURIComponent(match[1]));
            } catch (error) {
              headers = {};
            }
          }
          if (!/^https?:\/\//i.test(imageUrl)) return imageUrl;
          return '/image-proxy?url=' + encodeURIComponent(imageUrl) + '&headers=' + encodeURIComponent(JSON.stringify(headers));
        }

        function addBookCover(book, row) {
          var cover;
          var placeholder;
          if (!book.cover) {
            placeholder = document.createElement('span');
            placeholder.className = 'book-cover-placeholder';
            placeholder.textContent = '书籍';
            row.appendChild(placeholder);
            return;
          }
          cover = document.createElement('img');
          cover.className = 'book-cover';
          cover.alt = '';
          cover.src = getCoverUrl(book.cover);
          cover.onerror = function () {
            var fallback = document.createElement('span');
            fallback.className = 'book-cover-placeholder';
            fallback.textContent = '书籍';
            if (cover.parentNode) cover.parentNode.replaceChild(fallback, cover);
          };
          row.appendChild(cover);
        }

        function updateReaderLayout() {
          var style = window.getComputedStyle(readerText);
          var horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
          var pageWidth = readerText.clientWidth || window.innerWidth;
          readerText.style.webkitColumnWidth = Math.max(1, pageWidth - horizontalPadding) + 'px';
          readerText.style.columnWidth = Math.max(1, pageWidth - horizontalPadding) + 'px';
          readerText.style.webkitColumnGap = horizontalPadding + 'px';
          readerText.style.columnGap = horizontalPadding + 'px';
        }

        function getScrollPercentage() {
          var scrollable = Math.max(0, readerText.scrollWidth - readerText.clientWidth);
          return scrollable > 0 ? Math.floor((readerText.scrollLeft / scrollable) * 100000) : 0;
        }

        function restoreScrollPercentage(percentage) {
          var scrollable = Math.max(0, readerText.scrollWidth - readerText.clientWidth);
          var pageWidth = readerText.clientWidth || window.innerWidth;
          var target = scrollable * ((Number(percentage) || 0) / 100000);
          var page = Math.round(target / pageWidth);
          readerText.scrollLeft = Math.min(scrollable, page * pageWidth);
        }

        function alignReaderPage() {
          var scrollable = Math.max(0, readerText.scrollWidth - readerText.clientWidth);
          var pageWidth = readerText.clientWidth || window.innerWidth;
          var page = Math.round(readerText.scrollLeft / pageWidth);
          readerText.scrollLeft = Math.min(scrollable, page * pageWidth);
        }

        function md5(value) {
          var input = unescape(encodeURIComponent(value));
          var words = [];
          var shifts = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
          var state = [1732584193, -271733879, -1732584194, 271733878];
          var length = input.length;
          var wordCount = (((length + 8) >>> 6) + 1) * 16;
          var i;
          var block;
          var a;
          var b;
          var c;
          var d;
          var f;
          var g;
          var shift;
          var next;
          var round;
          var k;
          var hex = '';

          for (i = 0; i < wordCount; i++) words[i] = 0;
          for (i = 0; i < length; i++) words[i >>> 2] |= input.charCodeAt(i) << ((i % 4) * 8);
          words[length >>> 2] |= 128 << ((length % 4) * 8);
          words[wordCount - 2] = (length * 8) | 0;
          words[wordCount - 1] = Math.floor((length * 8) / 4294967296);

          for (block = 0; block < wordCount; block += 16) {
            a = state[0];
            b = state[1];
            c = state[2];
            d = state[3];

            for (i = 0; i < 64; i++) {
              if (i < 16) {
                f = (b & c) | (~b & d);
                g = i;
                round = 0;
              } else if (i < 32) {
                f = (d & b) | (~d & c);
                g = (5 * i + 1) % 16;
                round = 1;
              } else if (i < 48) {
                f = b ^ c ^ d;
                g = (3 * i + 5) % 16;
                round = 2;
              } else {
                f = c ^ (b | ~d);
                g = (7 * i) % 16;
                round = 3;
              }

              shift = shifts[round * 4 + (i % 4)];
              k = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
              next = (a + f + k + words[block + g]) | 0;
              next = (next << shift) | (next >>> (32 - shift));
              next = (b + next) | 0;
              a = d;
              d = c;
              c = b;
              b = next;
            }

            state[0] = (state[0] + a) | 0;
            state[1] = (state[1] + b) | 0;
            state[2] = (state[2] + c) | 0;
            state[3] = (state[3] + d) | 0;
          }

          for (i = 0; i < 4; i++) {
            for (block = 0; block < 4; block++) {
              hex += ('0' + ((state[i] >>> (block * 8)) & 255).toString(16)).slice(-2);
            }
          }
          return hex;
        }

        function showView(id) {
          var i;
          for (i = 0; i < viewIds.length; i++) {
            document.getElementById(viewIds[i]).className = viewIds[i] === id ? '' : 'hidden';
          }
          document.body.className = id === 'readerView' ? 'reading' : '';
          document.documentElement.className = id === 'readerView' ? 'reading' : '';
          currentView = id;
        }

        function request(path, data, callback) {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', '/' + path, true);
          xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
          xhr.onreadystatechange = function () {
            var result;
            if (xhr.readyState !== 4) return;
            if (xhr.status < 200 || xhr.status >= 300) {
              callback(new Error('服务器请求失败（' + xhr.status + '）'));
              return;
            }
            try {
              result = JSON.parse(xhr.responseText);
            } catch (error) {
              callback(new Error('服务器返回了无法识别的数据'));
              return;
            }
            if (result.code === 401) {
              showAccess(false);
              return;
            }
            if (result.code === 10001) {
              showAccess(true);
              return;
            }
            if (result.code !== 0) {
              callback(new Error(result.msg || '请求失败'));
              return;
            }
            callback(null, result.data);
          };
          xhr.onerror = function () {
            callback(new Error('无法连接 AnyReader 服务，请检查网络连接'));
          };
          xhr.send(JSON.stringify(data || {}));
        }

        function showAccess(needsSetup) {
          accessMode = needsSetup ? 'install' : 'login';
          document.getElementById('accessTitle').textContent = needsSetup ? '首次使用' : '需要登录';
          document.getElementById('accessDescription').textContent = needsSetup
            ? '请先设置 AnyReader 访问密码。'
            : '请输入 AnyReader 访问密码。';
          document.getElementById('accessButton').textContent = needsSetup ? '设置密码' : '登录';
          document.getElementById('password').autocomplete = needsSetup ? 'new-password' : 'current-password';
          showView('accessView');
          setNotice('', false);
        }

        function showBookshelf() {
          showView('booksView');
          setNotice('', false);
          loadBookshelf();
        }

        function loadBookshelf() {
          var requestId = ++favoritesRequestId;
          var list = document.getElementById('favoritesList');
          var localBooks = [];
          var favoriteBooks = [];
          var errors = [];
          var pending = 2;

          function finishRequest() {
            var i;
            if (--pending || requestId !== favoritesRequestId) return;
            list.textContent = '';
            for (i = 0; i < localBooks.length; i++) {
              addFavorite(localBooks[i], list, true);
            }
            for (i = 0; i < favoriteBooks.length; i++) {
              addFavorite(favoriteBooks[i], list, false);
            }
            if (errors.length) {
              favoritesStatus.className = 'notice error';
              favoritesStatus.textContent = '部分书架内容加载失败：' + errors.join('；');
            } else if (!localBooks.length && !favoriteBooks.length) {
              favoritesStatus.className = 'notice';
              favoritesStatus.textContent = '书架为空。可在 AnyReader 设置中配置本地书籍目录，或在完整版收藏书籍。';
            } else {
              favoritesStatus.className = 'notice';
              favoritesStatus.textContent = '';
            }
          }

          list.textContent = '';
          favoritesStatus.className = 'notice';
          favoritesStatus.textContent = '正在加载书架...';
          request('resource-favorites/list', {}, function (error, data) {
            if (requestId !== favoritesRequestId) return;
            if (error) {
              errors.push('收藏：' + error.message);
            } else {
              favoriteBooks = data || [];
            }
            finishRequest();
          });
          request('bookshelf/list', {}, function (error, data) {
            if (requestId !== favoritesRequestId) return;
            if (error) {
              errors.push('本地书籍：' + error.message);
            } else {
              localBooks = data || [];
            }
            finishRequest();
          });
        }

        function addFavorite(book, list, isLocal) {
          var row = document.createElement('div');
          var link = document.createElement('a');
          var removeButton = document.createElement('button');
          var details = document.createElement('div');
          var bookPath = isLocal ? book.path : book.url;
          link.href = '#';
          link.textContent = book.name || bookPath || '未命名书籍';
          link.onclick = function () {
            loadChapters({
              name: book.name,
              path: bookPath,
              ruleId: isLocal ? '' : book.ruleId
            });
            return false;
          };
          row.className = 'book';
          addBookCover(book, row);
          details.className = 'book-details';
          link.className = 'book-title';
          details.appendChild(link);
          if (isLocal) {
            var localLabel = document.createElement('div');
            localLabel.className = 'muted';
            localLabel.textContent = '本地书籍';
            details.appendChild(localLabel);
          }
          if (book.author) {
            var author = document.createElement('div');
            author.className = 'muted';
            author.textContent = '作者：' + book.author;
            details.appendChild(author);
          }
          if (!isLocal && book.chapter) {
            var latestChapter = document.createElement('div');
            latestChapter.className = 'muted';
            latestChapter.textContent = '最近章节：' + book.chapter;
            details.appendChild(latestChapter);
          }
          if (!isLocal) {
            removeButton.type = 'button';
            removeButton.textContent = '取消收藏';
            removeButton.onclick = function () {
              removeFavorite(book, removeButton);
            };
            details.appendChild(removeButton);
          }
          row.appendChild(details);
          list.appendChild(row);
        }

        function removeFavorite(book, button) {
          button.disabled = true;
          request('resource-favorites/unstar', { ruleId: book.ruleId, url: book.url }, function (error) {
            if (error) {
              button.disabled = false;
              favoritesStatus.className = 'notice error';
              favoritesStatus.textContent = '取消收藏失败：' + error.message;
              return;
            }
            loadBookshelf();
          });
        }

        function loadChapters(book) {
          var requestId = ++chapterRequestId;
          selectedBook = book;
          chapters = [];
          chapterIndex = -1;
          document.getElementById('bookTitle').textContent = book.name || '目录';
          document.getElementById('chaptersList').textContent = '';
          document.getElementById('resumeRow').className = 'hidden';
          showView('chaptersView');
          setNotice('正在加载目录...', false);
          request('rule-manager/chapter', { filePath: book.path, ruleId: book.ruleId || '' }, function (error, data) {
            var list = document.getElementById('chaptersList');
            var i;
            if (requestId !== chapterRequestId) return;
            list.textContent = '';
            if (error) {
              setNotice(error.message, true);
              return;
            }
            chapters = data || [];
            if (!chapters.length) {
              setNotice('没有找到章节。', false);
              return;
            }
            setNotice('', false);
            for (i = 0; i < chapters.length; i++) {
              addChapter(chapters[i], i, list);
            }
            loadLastReadChapter(requestId);
          });
        }

        function addChapter(chapter, index, list) {
          var row = document.createElement('div');
          var link = document.createElement('a');
          link.href = '#';
          link.textContent = chapter.name || '第 ' + (index + 1) + ' 章';
          link.onclick = function () {
            openChapter(index);
            return false;
          };
          row.className = 'chapter';
          row.appendChild(link);
          list.appendChild(row);
        }

        function loadLastReadChapter(requestId) {
          request('chapter-history/list', { ruleId: selectedBook.ruleId || '', filePath: selectedBook.path }, function (error, history) {
            var lastRead;
            var i;
            var resumeIndex;
            var resumeButton = document.getElementById('resumeButton');
            if (requestId !== chapterRequestId) return;
            if (error) {
              setNotice('无法读取阅读进度：' + error.message, true);
              return;
            }
            if (!history || !history.length) return;
            lastRead = history[0];
            for (i = 0; i < chapters.length; i++) {
              if (chapters[i].chapterPath === lastRead.chapterPath) {
                resumeIndex = i;
                resumeButton.textContent = '继续阅读：' + (chapters[i].name || '上次阅读章节');
                resumeButton.onclick = (function (index, percentage) {
                  return function () {
                    openChapter(index, percentage);
                    return false;
                  };
                })(resumeIndex, lastRead.percentage);
                document.getElementById('resumeRow').className = '';
                return;
              }
            }
          });
        }

        function openChapter(index, percentage) {
          var chapter = chapters[index];
          var requestId = ++contentRequestId;
          var resumePercentage = Number(percentage) || 0;
          if (!chapter || !selectedBook) return;
          chapterIndex = index;
          showView('readerView');
          updateReaderLayout();
          document.getElementById('chapterTitle').textContent = chapter.name || '正文';
          readerText.textContent = '正在加载正文...';
          readerText.scrollLeft = 0;
          setNotice('', false);
          request(
            'rule-manager/content',
            {
              filePath: selectedBook.path,
              chapterPath: chapter.chapterPath,
              ruleId: selectedBook.ruleId || ''
            },
            function (error, data) {
              if (requestId !== contentRequestId) return;
              if (error) {
                readerText.textContent = '';
                setNotice(error.message, true);
                return;
              }
              if (data && data.contentDecoder) {
                decodeContent(data.content, requestId, resumePercentage);
              } else {
                renderContent(data && data.content, resumePercentage);
                saveProgress(resumePercentage);
              }
            }
          );
        }

        function decodeContent(content, requestId, percentage) {
          var values = typeof content === 'string' ? [content] : content || [];
          var decoded = new Array(values.length);
          var nextIndex = 0;
          var active = 0;
          var completed = 0;
          var failed = false;

          function decodeNext() {
            var index;
            if (requestId !== contentRequestId || failed) return;
            if (completed === values.length) {
              renderContent(decoded, percentage);
              saveProgress(percentage);
              return;
            }
            while (active < 4 && nextIndex < values.length) {
              index = nextIndex++;
              active++;
              request('rule-manager/content-decoder', { ruleId: selectedBook.ruleId, content: values[index] }, function (error, text) {
                active--;
                if (requestId !== contentRequestId) return;
                if (error) {
                  failed = true;
                  readerText.textContent = '';
                  setNotice('正文解密失败：' + error.message, true);
                  return;
                }
                decoded[index] = text;
                completed++;
                decodeNext();
              });
            }
          }

          if (!values.length) {
            renderContent([], percentage);
            saveProgress(percentage);
            return;
          }
          decodeNext();
        }

        function plainText(value) {
          return String(value)
            .replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, '')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi, '')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/(p|div|h[1-6]|li|section|article)\s*>/gi, '\n\n')
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;|&#160;|&#xA0;/gi, ' ')
            .replace(/&amp;/gi, '&')
            .replace(/&lt;/gi, '<')
            .replace(/&gt;/gi, '>')
            .replace(/&quot;/gi, '"')
            .replace(/&#39;|&apos;/gi, "'")
            .replace(/&#(?:x([0-9a-f]+)|([0-9]+));/gi, function (match, hex, decimal) {
              return String.fromCharCode(parseInt(hex || decimal, hex ? 16 : 10));
            });
        }

        function renderContent(content, percentage) {
          var values;
          var i;
          readerText.textContent = '';
          if (typeof content === 'string') {
            values = [content];
          } else if (content && typeof content.length === 'number') {
            values = content;
          } else {
            values = [];
          }
          for (i = 0; i < values.length; i++) {
            if (!values[i]) continue;
            var paragraph = document.createElement('div');
            paragraph.className = 'reader-paragraph';
            paragraph.textContent = plainText(values[i]);
            readerText.appendChild(paragraph);
          }
          readerText.style.fontSize = readerFontSize + 'px';
          restoreScrollPercentage(percentage);
          if (!readerText.firstChild) {
            setNotice('本章没有可显示的正文。', false);
          }
        }

        function turnPage(direction) {
          var pageWidth = readerText.clientWidth || window.innerWidth;
          var maxScroll = Math.max(0, readerText.scrollWidth - readerText.clientWidth);
          var nextScroll = readerText.scrollLeft + direction * pageWidth;
          if (direction > 0 && readerText.scrollLeft >= maxScroll - 2 && chapterIndex < chapters.length - 1) {
            openChapter(chapterIndex + 1);
            return;
          }
          if (direction < 0 && readerText.scrollLeft <= 2 && chapterIndex > 0) {
            openChapter(chapterIndex - 1, 100000);
            return;
          }
          readerText.scrollLeft = Math.max(0, Math.min(maxScroll, nextScroll));
          saveScrollProgress();
        }

        function saveProgress(percentage) {
          var chapter = chapters[chapterIndex];
          if (!chapter || !selectedBook) return;
          request(
            'chapter-history/save',
            {
              ruleId: selectedBook.ruleId || '',
              filePath: selectedBook.path,
              chapterPath: chapter.chapterPath,
              percentage: percentage
            },
            function (error) {
              if (error) setNotice('阅读进度保存失败：' + error.message, true);
            }
          );
        }

        function saveScrollProgress() {
          var scrollable = Math.max(0, readerText.scrollWidth - readerText.clientWidth);
          var percentage = scrollable > 0 ? Math.floor((readerText.scrollLeft / scrollable) * 100000) : 0;
          saveProgress(percentage);
        }

        function bindChapterButton(id, step) {
          document.getElementById(id).onclick = function () {
            turnPage(step);
          };
        }

        document.getElementById('accessForm').onsubmit = function (event) {
          var password = document.getElementById('password').value;
          var xhr = new XMLHttpRequest();
          event = event || window.event;
          if (event.preventDefault) event.preventDefault();
          xhr.open('POST', '/' + accessMode, true);
          xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
          xhr.onreadystatechange = function () {
            var result;
            if (xhr.readyState !== 4) return;
            try {
              result = JSON.parse(xhr.responseText);
            } catch (error) {
              setNotice('服务器返回了无法识别的数据', true);
              return;
            }
            if (xhr.status < 200 || xhr.status >= 300 || result.code !== 0) {
              setNotice(result.msg || '密码验证失败', true);
              return;
            }
            document.getElementById('password').value = '';
            showBookshelf();
          };
          xhr.onerror = function () {
            setNotice('无法连接 AnyReader 服务，请检查网络连接', true);
          };
          xhr.send(JSON.stringify({ password: md5(password) }));
          return false;
        };

        document.getElementById('refreshFavorites').onclick = loadBookshelf;
        document.getElementById('backToBooks').onclick = function () {
          showBookshelf();
          return false;
        };
        document.getElementById('reloadChapters').onclick = function () {
          if (selectedBook) loadChapters(selectedBook);
          return false;
        };
        document.getElementById('backToChapters').onclick = function () {
          showView('chaptersView');
          return false;
        };
        bindChapterButton('previousPage', -1);
        bindChapterButton('nextPage', 1);
        document.getElementById('smallerText').onclick = function () {
          var percentage = getScrollPercentage();
          readerFontSize = Math.max(minimumReaderFontSize, readerFontSize - 2);
          saveReaderFontSize();
          readerText.style.fontSize = readerFontSize + 'px';
          updateReaderLayout();
          restoreScrollPercentage(percentage);
          saveScrollProgress();
        };
        document.getElementById('largerText').onclick = function () {
          var percentage = getScrollPercentage();
          readerFontSize = Math.min(maximumReaderFontSize, readerFontSize + 2);
          saveReaderFontSize();
          readerText.style.fontSize = readerFontSize + 'px';
          updateReaderLayout();
          restoreScrollPercentage(percentage);
          saveScrollProgress();
        };
        readerText.onscroll = function () {
          if (currentView !== 'readerView') return;
          if (progressTimer) window.clearTimeout(progressTimer);
          progressTimer = window.setTimeout(function () {
            alignReaderPage();
            saveScrollProgress();
          }, 1000);
        };
        readerText.ontouchstart = function (event) {
          if (event.touches && event.touches.length) touchStartX = event.touches[0].clientX;
        };
        readerText.ontouchend = function (event) {
          var endX;
          var difference;
          if (!event.changedTouches || !event.changedTouches.length) return;
          endX = event.changedTouches[0].clientX;
          difference = endX - touchStartX;
          if (Math.abs(difference) < 40) return;
          ignoreNextReaderClick = true;
          window.setTimeout(function () {
            ignoreNextReaderClick = false;
          }, 600);
          turnPage(difference < 0 ? 1 : -1);
          if (event.preventDefault) event.preventDefault();
        };
        readerText.onclick = function (event) {
          var bounds = readerText.getBoundingClientRect();
          var x = (event.clientX || event.pageX) - bounds.left;
          var width = bounds.width || readerText.clientWidth || window.innerWidth;
          if (ignoreNextReaderClick) {
            ignoreNextReaderClick = false;
            return;
          }
          if (x < width * 0.3) turnPage(-1);
          else if (x > width * 0.7) turnPage(1);
        };
        function handleReaderViewportResize() {
          if (currentView !== 'readerView') return;
          var percentage = getScrollPercentage();
          updateReaderLayout();
          restoreScrollPercentage(percentage);
        }

        window.addEventListener('resize', handleReaderViewportResize);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', handleReaderViewportResize);
        }

        showBookshelf();
      })();
    </script>
  </body>
</html>
